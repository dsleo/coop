[project]
name = "coop"
version = "0.2.0"
description = "Spend spare AI subscription tokens helping friends on GitHub."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "mcp>=1.0.0",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
coop = "coop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
